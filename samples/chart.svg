<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="200" viewBox="0 0 320 200"><title>Monthly orders</title><defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
<g id="axis" stroke="#888"><line x1="40" y1="170" x2="300" y2="170"/><line x1="40" y1="20" x2="40" y2="170"/></g>
<g id="bars" fill="url(#bar)"><rect x="60" y="90" width="30" height="80"><title>January: 80</title></rect><rect x="110" y="60" width="30" height="110"><title>February: 110</title></rect><rect x="160" y="40" width="30" height="130"><title>March: 130</title></rect><rect x="210" y="75" width="30" height="95"><title>April: 95</title></rect></g>
<text x="40" y="190" font-size="11" xml:space="preserve">Orders   per   month</text><use xlink:href="#axis" opacity="0"/>
</svg>
